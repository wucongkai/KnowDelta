# Optional complete local stack: docker compose -f compose.yaml -f compose.app.yaml up --build -d
name: knowdelta-container
x-backend: &backend
  image: knowdelta-backend:local
  build:
    context: .
    dockerfile: backend/Dockerfile
  environment: &environment
    KNOWDELTA_DATABASE_URL: postgresql+psycopg://knowdelta:${POSTGRES_PASSWORD:-knowdelta_local}@postgres:5432/knowdelta
    KNOWDELTA_REDIS_URL: redis://redis:6379/0
    KNOWDELTA_DATA_ROOT: /app/data
    KNOWDELTA_API_HOST: 0.0.0.0
    KNOWDELTA_CORS_ORIGINS: '["http://localhost:8080","http://127.0.0.1:8080"]'
    KNOWDELTA_LLM_BASE_URL: ${KNOWDELTA_LLM_BASE_URL:-}
    KNOWDELTA_LLM_MODEL: ${KNOWDELTA_LLM_MODEL:-}
    KNOWDELTA_LLM_API_KEY: ${KNOWDELTA_LLM_API_KEY:-}
    KNOWDELTA_VISION_MODEL: ${KNOWDELTA_VISION_MODEL:-}
  volumes:
    - app_data:/app/data
  init: true

services:
  postgres:
    ports: !reset []
  redis:
    ports: !reset []
  migrate:
    <<: *backend
    command: ["alembic", "-c", "backend/alembic.ini", "upgrade", "head"]
    depends_on:
      postgres: { condition: service_healthy }
  api:
    <<: *backend
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  worker:
    <<: *backend
    command: ["celery", "-A", "knowdelta.web.worker:celery_app", "worker", "--pool=solo", "--concurrency=1", "--loglevel=INFO"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    stop_grace_period: 20s
    restart: unless-stopped
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

volumes:
  app_data:
