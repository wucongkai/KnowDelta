name: knowdelta
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: knowdelta
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-knowdelta_local}
      POSTGRES_DB: knowdelta
    ports: ["127.0.0.1:54329:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowdelta -d knowdelta"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  redis:
    image: redis:7.4.5-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:63799:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  postgres_data:
  redis_data:
