[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "knowdelta"
version = "0.1.0"
description = "Bilibili and local video to traceable illustrated Markdown notes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "filelock>=3.18,<4",
  "httpx>=0.28,<1",
  "imageio-ffmpeg>=0.6,<1",
  "numpy>=2,<3",
  "opencv-python-headless>=4.11,<5",
  "pydantic>=2.11,<3",
  "pysubs2>=1.8,<2",
  "python-dotenv>=1.1,<2",
  "yt-dlp>=2025.8.22",
]

[project.optional-dependencies]
asr = ["faster-whisper>=1.1,<2"]
web = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<3",
  "alembic>=1.15,<2", "psycopg[binary]>=3.2,<4", "celery[redis]>=5.5,<6",
  "pydantic-settings>=2.8,<3", "python-multipart>=0.0.20,<1",
]

[project.scripts]
knowdelta = "knowdelta.cli:main"
knowdelta-api = "knowdelta.web.app:main"
knowdelta-import = "knowdelta.web.importer:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/knowdelta"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
